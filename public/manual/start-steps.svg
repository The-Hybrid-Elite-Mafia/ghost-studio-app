<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 616" role="img"><title>Start here: your first session step by step</title><rect width="1000" height="616" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="43" fill="#eff7fa" font-size="24">Start here: your first session · follow in order</text><rect x="22" y="76" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="105" r="18" fill="#6ce4cf"/><text x="52" y="111" fill="#071820" text-anchor="middle" font-size="18">1</text><text x="86" y="107" fill="#eff7fa" font-size="18">From Ghost Rack, open Full DAW below the console. Tap DAW, then Import song / stems and</text><text x="86" y="132" fill="#eff7fa" font-size="18">choose your song or aligned stems.</text><path d="M52 160v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="184" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="213" r="18" fill="#6ce4cf"/><text x="52" y="219" fill="#071820" text-anchor="middle" font-size="18">2</text><text x="86" y="215" fill="#eff7fa" font-size="18">Wait until importing finishes. Read the import report if any file failed. Imported stems</text><text x="86" y="240" fill="#eff7fa" font-size="18">start together at 0:00.</text><path d="M52 268v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="292" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="321" r="18" fill="#6ce4cf"/><text x="52" y="327" fill="#071820" text-anchor="middle" font-size="18">3</text><text x="86" y="323" fill="#eff7fa" font-size="18">Press Play. If the app says it is preparing audio, wait for preparation to finish. Stop</text><text x="86" y="348" fill="#eff7fa" font-size="18">cancels preparation.</text><path d="M52 376v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="400" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="429" r="18" fill="#6ce4cf"/><text x="52" y="435" fill="#071820" text-anchor="middle" font-size="18">4</text><text x="86" y="431" fill="#eff7fa" font-size="18">Use the Mixer to balance stems. Select a stem before opening Track detail or adding its</text><text x="86" y="456" fill="#eff7fa" font-size="18">plugins.</text><path d="M52 484v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="508" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="537" r="18" fill="#6ce4cf"/><text x="52" y="543" fill="#071820" text-anchor="middle" font-size="18">5</text><text x="86" y="539" fill="#eff7fa" font-size="18">Tap Projects → Download project backup to keep the editable project, then Export mix to</text><text x="86" y="564" fill="#eff7fa" font-size="18">create a WAV.</text></g></svg>