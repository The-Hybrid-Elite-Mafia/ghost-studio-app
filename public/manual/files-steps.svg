<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 433" role="img"><title>Import, save and reopen step by step</title><rect width="1000" height="433" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="43" fill="#eff7fa" font-size="24">Import, save and reopen · follow in order</text><rect x="22" y="76" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="105" r="18" fill="#6ce4cf"/><text x="52" y="111" fill="#071820" text-anchor="middle" font-size="18">1</text><text x="86" y="107" fill="#eff7fa" font-size="18">Name your session and import audio in the Full DAW.</text><path d="M52 135v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="159" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="188" r="18" fill="#6ce4cf"/><text x="52" y="194" fill="#071820" text-anchor="middle" font-size="18">2</text><text x="86" y="190" fill="#eff7fa" font-size="18">Tap Save to keep the current session in this browser.</text><path d="M52 218v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="242" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="271" r="18" fill="#6ce4cf"/><text x="52" y="277" fill="#071820" text-anchor="middle" font-size="18">3</text><text x="86" y="273" fill="#eff7fa" font-size="18">Open Projects → Download project backup and keep the .ghostproject file.</text><path d="M52 301v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="325" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="354" r="18" fill="#6ce4cf"/><text x="52" y="360" fill="#071820" text-anchor="middle" font-size="18">4</text><text x="86" y="356" fill="#eff7fa" font-size="18">To restore it later, use Projects → Open project file; Open saved session restores the</text><text x="86" y="381" fill="#eff7fa" font-size="18">local browser save instead.</text></g></svg>