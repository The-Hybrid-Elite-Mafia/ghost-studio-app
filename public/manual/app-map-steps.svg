<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 591" role="img"><title>Choose the right workspace step by step</title><rect width="1000" height="591" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="43" fill="#eff7fa" font-size="24">Choose the right workspace · follow in order</text><rect x="22" y="76" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="105" r="18" fill="#6ce4cf"/><text x="52" y="111" fill="#071820" text-anchor="middle" font-size="18">1</text><text x="86" y="107" fill="#eff7fa" font-size="18">Open the studio. The photographic console is Ghost Rack; /rack opens the same console</text><text x="86" y="132" fill="#eff7fa" font-size="18">directly.</text><path d="M52 160v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="184" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="213" r="18" fill="#6ce4cf"/><text x="52" y="219" fill="#071820" text-anchor="middle" font-size="18">2</text><text x="86" y="215" fill="#eff7fa" font-size="18">For one-file compression, stay in Ghost Rack. For stems, editing or multi-track mixing,</text><text x="86" y="240" fill="#eff7fa" font-size="18">use Full DAW below the rack.</text><path d="M52 268v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="292" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="321" r="18" fill="#6ce4cf"/><text x="52" y="327" fill="#071820" text-anchor="middle" font-size="18">3</text><text x="86" y="323" fill="#eff7fa" font-size="18">Use Radio to listen to or upload station tracks. A radio upload does not load a track into</text><text x="86" y="348" fill="#eff7fa" font-size="18">the rack or DAW.</text><path d="M52 376v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="400" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="429" r="18" fill="#6ce4cf"/><text x="52" y="435" fill="#071820" text-anchor="middle" font-size="18">4</text><text x="86" y="431" fill="#eff7fa" font-size="18">Use Lyrics for writing. Use Plugin workshop for actual DAW inserts; the prompt library</text><text x="86" y="456" fill="#eff7fa" font-size="18">supplies text instructions.</text><path d="M52 484v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="508" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="537" r="18" fill="#6ce4cf"/><text x="52" y="543" fill="#071820" text-anchor="middle" font-size="18">5</text><text x="86" y="539" fill="#eff7fa" font-size="18">Keep the manual in another tab. Use its search box to find the exact label on your screen.</text></g></svg>