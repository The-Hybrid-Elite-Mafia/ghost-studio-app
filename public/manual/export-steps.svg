<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 408" role="img"><title>Export the mix or stems step by step</title><rect width="1000" height="408" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="43" fill="#eff7fa" font-size="24">Export the mix or stems · follow in order</text><rect x="22" y="76" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="105" r="18" fill="#6ce4cf"/><text x="52" y="111" fill="#071820" text-anchor="middle" font-size="18">1</text><text x="86" y="107" fill="#eff7fa" font-size="18">Save a project backup before exporting.</text><path d="M52 135v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="159" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="188" r="18" fill="#6ce4cf"/><text x="52" y="194" fill="#071820" text-anchor="middle" font-size="18">2</text><text x="86" y="190" fill="#eff7fa" font-size="18">Open Export mix and select mix, selected stem, aligned stems or MIDI as appropriate.</text><path d="M52 218v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="242" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="271" r="18" fill="#6ce4cf"/><text x="52" y="277" fill="#071820" text-anchor="middle" font-size="18">3</text><text x="86" y="273" fill="#eff7fa" font-size="18">Choose Full session or Time range, then sample rate, bit depth and peak ceiling for audio.</text><path d="M52 301v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="325" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="354" r="18" fill="#6ce4cf"/><text x="52" y="360" fill="#071820" text-anchor="middle" font-size="18">4</text><text x="86" y="356" fill="#eff7fa" font-size="18">Tap Render / export, wait for the download, and listen to the exported file.</text></g></svg>