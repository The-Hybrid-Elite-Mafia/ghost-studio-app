<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 566" role="img"><title>Play a song in the 3D rack step by step</title><rect width="1000" height="566" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="43" fill="#eff7fa" font-size="24">Play a song in the 3D rack · follow in order</text><rect x="22" y="76" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="105" r="18" fill="#6ce4cf"/><text x="52" y="111" fill="#071820" text-anchor="middle" font-size="18">1</text><text x="86" y="107" fill="#eff7fa" font-size="18">Tap Upload audio and select your recording. Wait for the filename and duration to appear.</text><path d="M52 135v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="159" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="188" r="18" fill="#6ce4cf"/><text x="52" y="194" fill="#071820" text-anchor="middle" font-size="18">2</text><text x="86" y="190" fill="#eff7fa" font-size="18">Press Play. Move the seek bar to another part of the song; Pause holds the position.</text><path d="M52 218v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="242" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="271" r="18" fill="#6ce4cf"/><text x="52" y="277" fill="#071820" text-anchor="middle" font-size="18">3</text><text x="86" y="273" fill="#eff7fa" font-size="18">Use Previous or Next to jump five seconds. These are not previous-song and next-song</text><text x="86" y="298" fill="#eff7fa" font-size="18">controls.</text><path d="M52 326v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="350" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="379" r="18" fill="#6ce4cf"/><text x="52" y="385" fill="#071820" text-anchor="middle" font-size="18">4</text><text x="86" y="381" fill="#eff7fa" font-size="18">Watch the IN and OUT meters while listening. The waveform is the output signal, not a</text><text x="86" y="406" fill="#eff7fa" font-size="18">measurement of mastering quality.</text><path d="M52 434v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="458" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="487" r="18" fill="#6ce4cf"/><text x="52" y="493" fill="#071820" text-anchor="middle" font-size="18">5</text><text x="86" y="489" fill="#eff7fa" font-size="18">To record instead, tap Record and allow the microphone. Tap Record again to finish; the</text><text x="86" y="514" fill="#eff7fa" font-size="18">take becomes the rack source. Save your existing project before replacing its source.</text></g></svg>