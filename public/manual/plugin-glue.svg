<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 542" role="img"><title>Glue Bus Master labeled control diagram</title><rect width="1000" height="542" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="40" fill="#eff7fa" font-size="24">Glue Bus Master</text><text x="28" y="77" fill="#95b5c7" font-size="16">CONTROL MAP · Match the numbers to the labels below</text><rect x="24" y="100" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="50" cy="129" r="17" fill="#6ce4cf"/><text x="50" y="135" text-anchor="middle" font-size="17" fill="#071820">1</text><text x="78" y="133" fill="#eff7fa" font-size="18">Threshold</text><text x="44" y="169" fill="#c1d7e4" font-size="17">Neutral 0 dB · -48 to 0</text><rect x="512" y="100" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="538" cy="129" r="17" fill="#6ce4cf"/><text x="538" y="135" text-anchor="middle" font-size="17" fill="#071820">2</text><text x="566" y="133" fill="#eff7fa" font-size="18">Ratio</text><text x="532" y="169" fill="#c1d7e4" font-size="17">Neutral 1.5 :1 · 1.5 to 4</text><rect x="24" y="208" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="50" cy="237" r="17" fill="#6ce4cf"/><text x="50" y="243" text-anchor="middle" font-size="17" fill="#071820">3</text><text x="78" y="241" fill="#eff7fa" font-size="18">Attack</text><text x="44" y="277" fill="#c1d7e4" font-size="17">Neutral 10 ms · 0.1 to 100</text><rect x="512" y="208" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="538" cy="237" r="17" fill="#6ce4cf"/><text x="538" y="243" text-anchor="middle" font-size="17" fill="#071820">4</text><text x="566" y="241" fill="#eff7fa" font-size="18">Release</text><text x="532" y="277" fill="#c1d7e4" font-size="17">Neutral 100 ms · 30 to 1500</text><rect x="24" y="316" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="50" cy="345" r="17" fill="#6ce4cf"/><text x="50" y="351" text-anchor="middle" font-size="17" fill="#071820">5</text><text x="78" y="349" fill="#eff7fa" font-size="18">Auto Release</text><text x="44" y="385" fill="#c1d7e4" font-size="17">Neutral 0 · 0 to 1</text><rect x="512" y="316" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="538" cy="345" r="17" fill="#6ce4cf"/><text x="538" y="351" text-anchor="middle" font-size="17" fill="#071820">6</text><text x="566" y="349" fill="#eff7fa" font-size="18">Makeup Gain</text><text x="532" y="385" fill="#c1d7e4" font-size="17">Neutral 0 dB · -12 to 12</text><rect x="24" y="424" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="50" cy="453" r="17" fill="#6ce4cf"/><text x="50" y="459" text-anchor="middle" font-size="17" fill="#071820">7</text><text x="78" y="457" fill="#eff7fa" font-size="18">Sidechain HPF</text><text x="44" y="493" fill="#c1d7e4" font-size="17">Neutral 0 Hz · 0 to 300</text><rect x="512" y="424" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="538" cy="453" r="17" fill="#6ce4cf"/><text x="538" y="459" text-anchor="middle" font-size="17" fill="#071820">8</text><text x="566" y="457" fill="#eff7fa" font-size="18">Mix</text><text x="532" y="493" fill="#c1d7e4" font-size="17">Neutral 0 % · 0 to 100</text></g></svg>