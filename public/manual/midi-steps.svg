<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 458" role="img"><title>MIDI instruments and recording step by step</title><rect width="1000" height="458" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="43" fill="#eff7fa" font-size="24">MIDI instruments and recording · follow in order</text><rect x="22" y="76" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="105" r="18" fill="#6ce4cf"/><text x="52" y="111" fill="#071820" text-anchor="middle" font-size="18">1</text><text x="86" y="107" fill="#eff7fa" font-size="18">Open Composition and recording and choose + MIDI instrument or Import MIDI notes.</text><path d="M52 135v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="159" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="188" r="18" fill="#6ce4cf"/><text x="52" y="194" fill="#071820" text-anchor="middle" font-size="18">2</text><text x="86" y="190" fill="#eff7fa" font-size="18">Select the note track and edit pitch, timing, duration and velocity in Piano roll / Note</text><text x="86" y="215" fill="#eff7fa" font-size="18">detail.</text><path d="M52 243v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="267" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="296" r="18" fill="#6ce4cf"/><text x="52" y="302" fill="#071820" text-anchor="middle" font-size="18">3</text><text x="86" y="298" fill="#eff7fa" font-size="18">Choose a synth patch and Apply instrument controls. Use on-screen keys to preview.</text><path d="M52 326v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="350" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="379" r="18" fill="#6ce4cf"/><text x="52" y="385" fill="#071820" text-anchor="middle" font-size="18">4</text><text x="86" y="381" fill="#eff7fa" font-size="18">Choose Record source, place the playhead and press Record when ready. Stop recording and</text><text x="86" y="406" fill="#eff7fa" font-size="18">audition the new material.</text></g></svg>