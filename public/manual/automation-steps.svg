<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 483" role="img"><title>Automation and MIDI learn step by step</title><rect width="1000" height="483" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="43" fill="#eff7fa" font-size="24">Automation and MIDI learn · follow in order</text><rect x="22" y="76" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="105" r="18" fill="#6ce4cf"/><text x="52" y="111" fill="#071820" text-anchor="middle" font-size="18">1</text><text x="86" y="107" fill="#eff7fa" font-size="18">Select a track and open its volume and pan automation, or focus a plugin control in the</text><text x="86" y="132" fill="#eff7fa" font-size="18">workshop.</text><path d="M52 160v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="184" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="213" r="18" fill="#6ce4cf"/><text x="52" y="219" fill="#071820" text-anchor="middle" font-size="18">2</text><text x="86" y="215" fill="#eff7fa" font-size="18">Enable the lane and set points using absolute session seconds.</text><path d="M52 243v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="267" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="296" r="18" fill="#6ce4cf"/><text x="52" y="302" fill="#071820" text-anchor="middle" font-size="18">3</text><text x="86" y="298" fill="#eff7fa" font-size="18">Play the session to hear the lane. Turn the lane off to return control to the manual fader</text><text x="86" y="323" fill="#eff7fa" font-size="18">or pan.</text><path d="M52 351v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="375" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="404" r="18" fill="#6ce4cf"/><text x="52" y="410" fill="#071820" text-anchor="middle" font-size="18">4</text><text x="86" y="406" fill="#eff7fa" font-size="18">For a hardware control, Connect MIDI, focus the desired parameter, start its learn action</text><text x="86" y="431" fill="#eff7fa" font-size="18">and move the controller. Save the project to keep mappings.</text></g></svg>