<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 433" role="img"><title>Choose the correct file loader step by step</title><rect width="1000" height="433" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="43" fill="#eff7fa" font-size="24">Choose the correct file loader · follow in order</text><rect x="22" y="76" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="105" r="18" fill="#6ce4cf"/><text x="52" y="111" fill="#071820" text-anchor="middle" font-size="18">1</text><text x="86" y="107" fill="#eff7fa" font-size="18">Identify what the file contains, not just its extension.</text><path d="M52 135v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="159" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="188" r="18" fill="#6ce4cf"/><text x="52" y="194" fill="#071820" text-anchor="middle" font-size="18">2</text><text x="86" y="190" fill="#eff7fa" font-size="18">Use Rack Presets for Dynamics A settings and Rack Projects for a one-source project.</text><path d="M52 218v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="242" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="271" r="18" fill="#6ce4cf"/><text x="52" y="277" fill="#071820" text-anchor="middle" font-size="18">3</text><text x="86" y="273" fill="#eff7fa" font-size="18">Use Full DAW Projects for .ghostproject; use Plugin workshop → Import plugin for</text><text x="86" y="298" fill="#eff7fa" font-size="18">.ghostplugin.json.</text><path d="M52 326v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="350" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="379" r="18" fill="#6ce4cf"/><text x="52" y="385" fill="#071820" text-anchor="middle" font-size="18">4</text><text x="86" y="381" fill="#eff7fa" font-size="18">Use Lyrics → Open draft file for lyrics JSON. Use an audio importer for a recording.</text></g></svg>