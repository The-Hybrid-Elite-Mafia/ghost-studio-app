<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 724" role="img"><title>Create or rewrite lyrics step by step</title><rect width="1000" height="724" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="43" fill="#eff7fa" font-size="24">Create or rewrite lyrics · follow in order</text><rect x="22" y="76" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="105" r="18" fill="#6ce4cf"/><text x="52" y="111" fill="#071820" text-anchor="middle" font-size="18">1</text><text x="86" y="107" fill="#eff7fa" font-size="18">Choose Write new lyrics or Rewrite my lyrics. Enter a title if you have one, and explain</text><text x="86" y="132" fill="#eff7fa" font-size="18">what actually happens in the song.</text><path d="M52 160v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="184" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="213" r="18" fill="#6ce4cf"/><text x="52" y="219" fill="#071820" text-anchor="middle" font-size="18">2</text><text x="86" y="215" fill="#eff7fa" font-size="18">For a rewrite, paste the original or Import a text file. Fill Keep, Exact lines to</text><text x="86" y="240" fill="#eff7fa" font-size="18">protect, Fix and Extend as needed. Protected lines must already exist in the original.</text><path d="M52 268v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="292" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="321" r="18" fill="#6ce4cf"/><text x="52" y="327" fill="#071820" text-anchor="middle" font-size="18">3</text><text x="86" y="323" fill="#eff7fa" font-size="18">Open Sound &amp; delivery. Set Genre / blend, Instruments, Lead voice, Tempo, Key, Language,</text><text x="86" y="348" fill="#eff7fa" font-size="18">Target length and Writing / rhyme.</text><path d="M52 376v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="400" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="429" r="18" fill="#6ce4cf"/><text x="52" y="435" fill="#071820" text-anchor="middle" font-size="18">4</text><text x="86" y="431" fill="#eff7fa" font-size="18">Open Story &amp; production direction for Audience, Core emotion, Perspective, Reference /</text><text x="86" y="456" fill="#eff7fa" font-size="18">library prompt and Avoid.</text><path d="M52 484v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="508" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="537" r="18" fill="#6ce4cf"/><text x="52" y="543" fill="#071820" text-anchor="middle" font-size="18">5</text><text x="86" y="539" fill="#eff7fa" font-size="18">The owner can tap Write song package. Read the result, edit the output cards, and check</text><text x="86" y="564" fill="#eff7fa" font-size="18">warnings before copying or exporting.</text><path d="M52 592v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="616" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="645" r="18" fill="#6ce4cf"/><text x="52" y="651" fill="#071820" text-anchor="middle" font-size="18">6</text><text x="86" y="647" fill="#eff7fa" font-size="18">Copy or download anything you want to keep before leaving. The workspace is temporary and</text><text x="86" y="672" fill="#eff7fa" font-size="18">clears when you exit.</text></g></svg>