<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 516" role="img"><title>Build and insert your own plugin chain step by step</title><rect width="1000" height="516" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="43" fill="#eff7fa" font-size="24">Build and insert your own plugin chain · follow in order</text><rect x="22" y="76" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="105" r="18" fill="#6ce4cf"/><text x="52" y="111" fill="#071820" text-anchor="middle" font-size="18">1</text><text x="86" y="107" fill="#eff7fa" font-size="18">Select the stem in the DAW if this chain belongs on one track.</text><path d="M52 135v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="159" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="188" r="18" fill="#6ce4cf"/><text x="52" y="194" fill="#071820" text-anchor="middle" font-size="18">2</text><text x="86" y="190" fill="#eff7fa" font-size="18">Open Plugin workshop. Tap New chain, give it a name, select a module, then Add module.</text><path d="M52 218v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="242" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="271" r="18" fill="#6ce4cf"/><text x="52" y="277" fill="#071820" text-anchor="middle" font-size="18">3</text><text x="86" y="273" fill="#eff7fa" font-size="18">New modules start neutral and bypassed. Enable the module and adjust only what you need. A</text><text x="86" y="298" fill="#eff7fa" font-size="18">wet/dry Mix of 0% still gives dry sound.</text><path d="M52 326v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="350" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="379" r="18" fill="#6ce4cf"/><text x="52" y="385" fill="#071820" text-anchor="middle" font-size="18">4</text><text x="86" y="381" fill="#eff7fa" font-size="18">Choose Destination: Selected stem or Master bus. Tap Insert chain.</text><path d="M52 409v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="433" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="462" r="18" fill="#6ce4cf"/><text x="52" y="468" fill="#071820" text-anchor="middle" font-size="18">5</text><text x="86" y="464" fill="#eff7fa" font-size="18">Use Save plugin for the local library, or Download plugin for a portable settings file.</text></g></svg>