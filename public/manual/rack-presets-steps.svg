<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 674" role="img"><title>Import and save presets step by step</title><rect width="1000" height="674" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="43" fill="#eff7fa" font-size="24">Import and save presets · follow in order</text><rect x="22" y="76" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="105" r="18" fill="#6ce4cf"/><text x="52" y="111" fill="#071820" text-anchor="middle" font-size="18">1</text><text x="86" y="107" fill="#eff7fa" font-size="18">Download Ghost-Dynamics-A-Neutral.json to your device if you want the neutral starter.</text><path d="M52 135v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="159" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="188" r="18" fill="#6ce4cf"/><text x="52" y="194" fill="#071820" text-anchor="middle" font-size="18">2</text><text x="86" y="190" fill="#eff7fa" font-size="18">Open Presets → Import preset. Choose the JSON from Downloads. Read the result message; it</text><text x="86" y="215" fill="#eff7fa" font-size="18">names the preset loaded.</text><path d="M52 243v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="267" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="296" r="18" fill="#6ce4cf"/><text x="52" y="302" fill="#071820" text-anchor="middle" font-size="18">3</text><text x="86" y="298" fill="#eff7fa" font-size="18">Select Ghost Neutral Start in Load preset. Check ratio 1:1 and makeup 0 dB on the rack.</text><path d="M52 326v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="350" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="379" r="18" fill="#6ce4cf"/><text x="52" y="385" fill="#071820" text-anchor="middle" font-size="18">4</text><text x="86" y="381" fill="#eff7fa" font-size="18">To keep your own changes, adjust the dials, open Presets, enter a name, then tap Save</text><text x="86" y="406" fill="#eff7fa" font-size="18">preset.</text><path d="M52 434v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="458" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="487" r="18" fill="#6ce4cf"/><text x="52" y="493" fill="#071820" text-anchor="middle" font-size="18">5</text><text x="86" y="489" fill="#eff7fa" font-size="18">Tap Download current settings for a portable file, or Export saved bank to back up all</text><text x="86" y="514" fill="#eff7fa" font-size="18">user presets.</text><path d="M52 542v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="566" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="595" r="18" fill="#6ce4cf"/><text x="52" y="601" fill="#071820" text-anchor="middle" font-size="18">6</text><text x="86" y="597" fill="#eff7fa" font-size="18">After a refresh, open Presets → Load preset. If the name is still listed, this browser</text><text x="86" y="622" fill="#eff7fa" font-size="18">retained it. Export before clearing browser data.</text></g></svg>