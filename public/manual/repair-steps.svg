<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 591" role="img"><title>Analyze stems and remove noise step by step</title><rect width="1000" height="591" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="43" fill="#eff7fa" font-size="24">Analyze stems and remove noise · follow in order</text><rect x="22" y="76" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="105" r="18" fill="#6ce4cf"/><text x="52" y="111" fill="#071820" text-anchor="middle" font-size="18">1</text><text x="86" y="107" fill="#eff7fa" font-size="18">Import the original stems and set their roles in Track detail.</text><path d="M52 135v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="159" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="188" r="18" fill="#6ce4cf"/><text x="52" y="194" fill="#071820" text-anchor="middle" font-size="18">2</text><text x="86" y="190" fill="#eff7fa" font-size="18">Select one stem and Analyze it. Read the explanation beside each suggestion.</text><path d="M52 218v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="242" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="271" r="18" fill="#6ce4cf"/><text x="52" y="277" fill="#071820" text-anchor="middle" font-size="18">3</text><text x="86" y="273" fill="#eff7fa" font-size="18">Use Insert suggestion for one recommendation, or ask Ghost: Apply needed plugins to the</text><text x="86" y="298" fill="#eff7fa" font-size="18">selected stem.</text><path d="M52 326v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="350" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="379" r="18" fill="#6ce4cf"/><text x="52" y="385" fill="#071820" text-anchor="middle" font-size="18">4</text><text x="86" y="381" fill="#eff7fa" font-size="18">Audition the result. Compare with the original at similar volume. Reduce or undo settings</text><text x="86" y="406" fill="#eff7fa" font-size="18">if consonants, transients or sustained notes sound damaged.</text><path d="M52 434v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="458" width="956" height="107" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="487" r="18" fill="#6ce4cf"/><text x="52" y="493" fill="#071820" text-anchor="middle" font-size="18">5</text><text x="86" y="489" fill="#eff7fa" font-size="18">Stem Cleanup can require background preparation. Playback continues with the previous</text><text x="86" y="514" fill="#eff7fa" font-size="18">result until the updated sound is ready. Read the preparation status before judging the</text><text x="86" y="539" fill="#eff7fa" font-size="18">new settings.</text></g></svg>