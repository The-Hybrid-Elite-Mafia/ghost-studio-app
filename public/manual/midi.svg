<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 482" role="img"><title>MIDI instruments and recording labeled control diagram</title><rect width="1000" height="482" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="40" fill="#eff7fa" font-size="24">MIDI instruments and recording</text><text x="28" y="77" fill="#95b5c7" font-size="16">CONTROL MAP · Match the numbers to the labels below</text><rect x="24" y="100" width="464" height="117" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="50" cy="129" r="17" fill="#6ce4cf"/><text x="50" y="135" text-anchor="middle" font-size="17" fill="#071820">1</text><text x="78" y="133" fill="#eff7fa" font-size="18">+ MIDI instrument / Import MIDI</text><text x="78" y="157" fill="#eff7fa" font-size="18">notes</text><text x="44" y="193" fill="#c1d7e4" font-size="17">Create or import a note track</text><rect x="512" y="100" width="464" height="117" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="538" cy="129" r="17" fill="#6ce4cf"/><text x="538" y="135" text-anchor="middle" font-size="17" fill="#071820">2</text><text x="566" y="133" fill="#eff7fa" font-size="18">Piano roll / Grid / Quantize</text><text x="532" y="169" fill="#c1d7e4" font-size="17">Edit note timing and pitches</text><rect x="24" y="232" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="50" cy="261" r="17" fill="#6ce4cf"/><text x="50" y="267" text-anchor="middle" font-size="17" fill="#071820">3</text><text x="78" y="265" fill="#eff7fa" font-size="18">Local synth patch / Apply</text><text x="44" y="301" fill="#c1d7e4" font-size="17">Set the synthesized instrument</text><rect x="512" y="232" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="538" cy="261" r="17" fill="#6ce4cf"/><text x="538" y="267" text-anchor="middle" font-size="17" fill="#071820">4</text><text x="566" y="265" fill="#eff7fa" font-size="18">Musical typing / Keyboard</text><text x="532" y="301" fill="#c1d7e4" font-size="17">Preview instrument notes</text><rect x="24" y="340" width="464" height="117" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="50" cy="369" r="17" fill="#6ce4cf"/><text x="50" y="375" text-anchor="middle" font-size="17" fill="#071820">5</text><text x="78" y="373" fill="#eff7fa" font-size="18">Chord / Arpeggio tools</text><text x="44" y="409" fill="#c1d7e4" font-size="17">Add a simple note pattern</text><rect x="512" y="340" width="464" height="117" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="538" cy="369" r="17" fill="#6ce4cf"/><text x="538" y="375" text-anchor="middle" font-size="17" fill="#071820">6</text><text x="566" y="373" fill="#eff7fa" font-size="18">Record source / Record / Input</text><text x="566" y="397" fill="#eff7fa" font-size="18">offset</text><text x="532" y="433" fill="#c1d7e4" font-size="17">Capture audio input or MIDI</text></g></svg>