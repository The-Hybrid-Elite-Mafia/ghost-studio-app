<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 458" role="img"><title>Track detail and clip editing labeled control diagram</title><rect width="1000" height="458" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="40" fill="#eff7fa" font-size="24">Track detail and clip editing</text><text x="28" y="77" fill="#95b5c7" font-size="16">CONTROL MAP · Match the numbers to the labels below</text><rect x="24" y="100" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="50" cy="129" r="17" fill="#6ce4cf"/><text x="50" y="135" text-anchor="middle" font-size="17" fill="#071820">1</text><text x="78" y="133" fill="#eff7fa" font-size="18">Timeline start</text><text x="44" y="169" fill="#c1d7e4" font-size="17">Where the clip begins in the song</text><rect x="512" y="100" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="538" cy="129" r="17" fill="#6ce4cf"/><text x="538" y="135" text-anchor="middle" font-size="17" fill="#071820">2</text><text x="566" y="133" fill="#eff7fa" font-size="18">Trim in / Trim out</text><text x="532" y="169" fill="#c1d7e4" font-size="17">Which part of the original file plays</text><rect x="24" y="208" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="50" cy="237" r="17" fill="#6ce4cf"/><text x="50" y="243" text-anchor="middle" font-size="17" fill="#071820">3</text><text x="78" y="241" fill="#eff7fa" font-size="18">Track role · Analyze</text><text x="44" y="277" fill="#c1d7e4" font-size="17">Tell Ghost the role; measure source</text><rect x="512" y="208" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="538" cy="237" r="17" fill="#6ce4cf"/><text x="538" y="243" text-anchor="middle" font-size="17" fill="#071820">4</text><text x="566" y="241" fill="#eff7fa" font-size="18">Effect checkbox · Edit chain</text><text x="532" y="277" fill="#c1d7e4" font-size="17">Enable or edit track effects</text><rect x="24" y="316" width="464" height="117" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="50" cy="345" r="17" fill="#6ce4cf"/><text x="50" y="351" text-anchor="middle" font-size="17" fill="#071820">5</text><text x="78" y="349" fill="#eff7fa" font-size="18">Duplicate / Move / Disable /</text><text x="78" y="373" fill="#eff7fa" font-size="18">Reverse</text><text x="44" y="409" fill="#c1d7e4" font-size="17">Clip editing tools</text><rect x="512" y="316" width="464" height="117" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="538" cy="345" r="17" fill="#6ce4cf"/><text x="538" y="351" text-anchor="middle" font-size="17" fill="#071820">6</text><text x="566" y="349" fill="#eff7fa" font-size="18">Fades · Clip gain · Automation</text><text x="532" y="385" fill="#c1d7e4" font-size="17">Shape clip playback</text></g></svg>