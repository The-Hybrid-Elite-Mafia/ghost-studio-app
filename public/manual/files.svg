<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 434" role="img"><title>Import, save and reopen labeled control diagram</title><rect width="1000" height="434" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="40" fill="#eff7fa" font-size="24">Import, save and reopen</text><text x="28" y="77" fill="#95b5c7" font-size="16">CONTROL MAP · Match the numbers to the labels below</text><rect x="24" y="100" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="50" cy="129" r="17" fill="#6ce4cf"/><text x="50" y="135" text-anchor="middle" font-size="17" fill="#071820">1</text><text x="78" y="133" fill="#eff7fa" font-size="18">Session name</text><text x="44" y="169" fill="#c1d7e4" font-size="17">Name the current project</text><rect x="512" y="100" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="538" cy="129" r="17" fill="#6ce4cf"/><text x="538" y="135" text-anchor="middle" font-size="17" fill="#071820">2</text><text x="566" y="133" fill="#eff7fa" font-size="18">Import song / stems</text><text x="532" y="169" fill="#c1d7e4" font-size="17">Add recorded audio</text><rect x="24" y="208" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="50" cy="237" r="17" fill="#6ce4cf"/><text x="50" y="243" text-anchor="middle" font-size="17" fill="#071820">3</text><text x="78" y="241" fill="#eff7fa" font-size="18">Save</text><text x="44" y="277" fill="#c1d7e4" font-size="17">Store this browser’s session</text><rect x="512" y="208" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="538" cy="237" r="17" fill="#6ce4cf"/><text x="538" y="243" text-anchor="middle" font-size="17" fill="#071820">4</text><text x="566" y="241" fill="#eff7fa" font-size="18">Open saved session</text><text x="532" y="277" fill="#c1d7e4" font-size="17">Restore that local save</text><rect x="24" y="316" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="50" cy="345" r="17" fill="#6ce4cf"/><text x="50" y="351" text-anchor="middle" font-size="17" fill="#071820">5</text><text x="78" y="349" fill="#eff7fa" font-size="18">Download project backup</text><text x="44" y="385" fill="#c1d7e4" font-size="17">Download a .ghostproject file</text><rect x="512" y="316" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="538" cy="345" r="17" fill="#6ce4cf"/><text x="538" y="351" text-anchor="middle" font-size="17" fill="#071820">6</text><text x="566" y="349" fill="#eff7fa" font-size="18">Open project file</text><text x="532" y="385" fill="#c1d7e4" font-size="17">Restore a downloaded backup</text></g></svg>