<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 649" role="img"><title>Upload and manage station songs step by step</title><rect width="1000" height="649" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="43" fill="#eff7fa" font-size="24">Upload and manage station songs · follow in order</text><rect x="22" y="76" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="105" r="18" fill="#6ce4cf"/><text x="52" y="111" fill="#071820" text-anchor="middle" font-size="18">1</text><text x="86" y="107" fill="#eff7fa" font-size="18">Sign in and open Upload. Choose the file or, for the owner, select several tracks.</text><path d="M52 135v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="159" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="188" r="18" fill="#6ce4cf"/><text x="52" y="194" fill="#071820" text-anchor="middle" font-size="18">2</text><text x="86" y="190" fill="#eff7fa" font-size="18">Check titles, artist and genre. An owner batch shares the chosen artist, genre and cover.</text><path d="M52 218v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="242" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="271" r="18" fill="#6ce4cf"/><text x="52" y="277" fill="#071820" text-anchor="middle" font-size="18">3</text><text x="86" y="273" fill="#eff7fa" font-size="18">Choose optional artwork and confirm that you have permission to share the audio and image.</text><path d="M52 301v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="325" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="354" r="18" fill="#6ce4cf"/><text x="52" y="360" fill="#071820" text-anchor="middle" font-size="18">4</text><text x="86" y="356" fill="#eff7fa" font-size="18">Start the upload and wait for the saved result. Use Retry unfinished uploads for failures;</text><text x="86" y="381" fill="#eff7fa" font-size="18">avoid uploading successful entries again.</text><path d="M52 409v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="433" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="462" r="18" fill="#6ce4cf"/><text x="52" y="468" fill="#071820" text-anchor="middle" font-size="18">5</text><text x="86" y="464" fill="#eff7fa" font-size="18">The owner opens Manage to Preview submissions, then Approve or Reject. Listener</text><text x="86" y="489" fill="#eff7fa" font-size="18">submissions stay private until approved.</text><path d="M52 517v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="541" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="570" r="18" fill="#6ce4cf"/><text x="52" y="576" fill="#071820" text-anchor="middle" font-size="18">6</text><text x="86" y="572" fill="#eff7fa" font-size="18">Use Change cover or Unpublish for existing entries. Delete permanently removes the station</text><text x="86" y="597" fill="#eff7fa" font-size="18">copy after confirmation; keep your original files.</text></g></svg>