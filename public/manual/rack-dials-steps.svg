<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 616" role="img"><title>Adjust Dynamics A step by step</title><rect width="1000" height="616" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="43" fill="#eff7fa" font-size="24">Adjust Dynamics A · follow in order</text><rect x="22" y="76" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="105" r="18" fill="#6ce4cf"/><text x="52" y="111" fill="#071820" text-anchor="middle" font-size="18">1</text><text x="86" y="107" fill="#eff7fa" font-size="18">Open Presets and load Ghost Neutral Start if you have imported it. Its ratio is 1:1 and</text><text x="86" y="132" fill="#eff7fa" font-size="18">makeup is 0 dB.</text><path d="M52 160v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="184" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="213" r="18" fill="#6ce4cf"/><text x="52" y="219" fill="#071820" text-anchor="middle" font-size="18">2</text><text x="86" y="215" fill="#eff7fa" font-size="18">Play a representative loud section. Enable IN and keep BYPASS off when auditioning</text><text x="86" y="240" fill="#eff7fa" font-size="18">processing.</text><path d="M52 268v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="292" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="321" r="18" fill="#6ce4cf"/><text x="52" y="327" fill="#071820" text-anchor="middle" font-size="18">3</text><text x="86" y="323" fill="#eff7fa" font-size="18">Drag one dial at a time. On a keyboard, use arrow keys; Shift gives finer adjustment</text><text x="86" y="348" fill="#eff7fa" font-size="18">during dragging.</text><path d="M52 376v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="400" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="429" r="18" fill="#6ce4cf"/><text x="52" y="435" fill="#071820" text-anchor="middle" font-size="18">4</text><text x="86" y="431" fill="#eff7fa" font-size="18">Compare BYPASS and IN at similar listening levels. Read GAIN REDUCTION to see how much the</text><text x="86" y="456" fill="#eff7fa" font-size="18">compressor is acting.</text><path d="M52 484v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="508" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="537" r="18" fill="#6ce4cf"/><text x="52" y="543" fill="#071820" text-anchor="middle" font-size="18">5</text><text x="86" y="539" fill="#eff7fa" font-size="18">Use A/B to switch between two settings snapshots. Save or download a preset when you want</text><text x="86" y="564" fill="#eff7fa" font-size="18">to keep a setting.</text></g></svg>