<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 699" role="img"><title>Choose genre and source chains step by step</title><rect width="1000" height="699" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="43" fill="#eff7fa" font-size="24">Choose genre and source chains · follow in order</text><rect x="22" y="76" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="105" r="18" fill="#6ce4cf"/><text x="52" y="111" fill="#071820" text-anchor="middle" font-size="18">1</text><text x="86" y="107" fill="#eff7fa" font-size="18">Open Workflows &amp; chains from a library entry or its workflow button. Search for your</text><text x="86" y="132" fill="#eff7fa" font-size="18">source, genre or vocal style.</text><path d="M52 160v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="184" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="213" r="18" fill="#6ce4cf"/><text x="52" y="219" fill="#071820" text-anchor="middle" font-size="18">2</text><text x="86" y="215" fill="#eff7fa" font-size="18">Select Workflow &amp; chains on the matching card. Read Source direction and the</text><text x="86" y="240" fill="#eff7fa" font-size="18">recording-to-export workflow.</text><path d="M52 268v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="292" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="321" r="18" fill="#6ce4cf"/><text x="52" y="327" fill="#071820" text-anchor="middle" font-size="18">3</text><text x="86" y="323" fill="#eff7fa" font-size="18">Expand a channel or bus chain. Check whether its destination is Selected track or Master</text><text x="86" y="348" fill="#eff7fa" font-size="18">bus.</text><path d="M52 376v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="400" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="429" r="18" fill="#6ce4cf"/><text x="52" y="435" fill="#071820" text-anchor="middle" font-size="18">4</text><text x="86" y="431" fill="#eff7fa" font-size="18">Use the route’s workshop button to open a neutral draft. Opening a draft does not insert</text><text x="86" y="456" fill="#eff7fa" font-size="18">or activate it.</text><path d="M52 484v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="508" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="537" r="18" fill="#6ce4cf"/><text x="52" y="543" fill="#071820" text-anchor="middle" font-size="18">5</text><text x="86" y="539" fill="#eff7fa" font-size="18">In the workshop, check the destination and Insert chain. Enable one stage at a time and</text><text x="86" y="564" fill="#eff7fa" font-size="18">adjust from the actual audio.</text><path d="M52 592v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="616" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="645" r="18" fill="#6ce4cf"/><text x="52" y="651" fill="#071820" text-anchor="middle" font-size="18">6</text><text x="86" y="647" fill="#eff7fa" font-size="18">Copy full workflow or Download guide if you want the text instructions outside the app.</text></g></svg>