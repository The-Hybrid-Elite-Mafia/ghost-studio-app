<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 326" role="img"><title>Stereo delay labeled control diagram</title><rect width="1000" height="326" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="40" fill="#eff7fa" font-size="24">Stereo delay</text><text x="28" y="77" fill="#95b5c7" font-size="16">CONTROL MAP · Match the numbers to the labels below</text><rect x="24" y="100" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="50" cy="129" r="17" fill="#6ce4cf"/><text x="50" y="135" text-anchor="middle" font-size="17" fill="#071820">1</text><text x="78" y="133" fill="#eff7fa" font-size="18">Time</text><text x="44" y="169" fill="#c1d7e4" font-size="17">Neutral 0 ms · 0 to 600</text><rect x="512" y="100" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="538" cy="129" r="17" fill="#6ce4cf"/><text x="538" y="135" text-anchor="middle" font-size="17" fill="#071820">2</text><text x="566" y="133" fill="#eff7fa" font-size="18">Feedback</text><text x="532" y="169" fill="#c1d7e4" font-size="17">Neutral 0 % · 0 to 60</text><rect x="24" y="208" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="50" cy="237" r="17" fill="#6ce4cf"/><text x="50" y="243" text-anchor="middle" font-size="17" fill="#071820">3</text><text x="78" y="241" fill="#eff7fa" font-size="18">Mix</text><text x="44" y="277" fill="#c1d7e4" font-size="17">Neutral 0 % · 0 to 50</text></g></svg>