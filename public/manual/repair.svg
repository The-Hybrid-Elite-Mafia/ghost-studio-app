<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 458" role="img"><title>Analyze stems and remove noise labeled control diagram</title><rect width="1000" height="458" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="40" fill="#eff7fa" font-size="24">Analyze stems and remove noise</text><text x="28" y="77" fill="#95b5c7" font-size="16">CONTROL MAP · Match the numbers to the labels below</text><rect x="24" y="100" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="50" cy="129" r="17" fill="#6ce4cf"/><text x="50" y="135" text-anchor="middle" font-size="17" fill="#071820">1</text><text x="78" y="133" fill="#eff7fa" font-size="18">Track role</text><text x="44" y="169" fill="#c1d7e4" font-size="17">Choose vocal, drums, bass or instrument</text><rect x="512" y="100" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="538" cy="129" r="17" fill="#6ce4cf"/><text x="538" y="135" text-anchor="middle" font-size="17" fill="#071820">2</text><text x="566" y="133" fill="#eff7fa" font-size="18">Analyze stem</text><text x="532" y="169" fill="#c1d7e4" font-size="17">Measure the source before effects</text><rect x="24" y="208" width="464" height="117" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="50" cy="237" r="17" fill="#6ce4cf"/><text x="50" y="243" text-anchor="middle" font-size="17" fill="#071820">3</text><text x="78" y="241" fill="#eff7fa" font-size="18">Source measurements</text><text x="44" y="277" fill="#c1d7e4" font-size="17">Peak, RMS, crest, DC and channels</text><rect x="512" y="208" width="464" height="117" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="538" cy="237" r="17" fill="#6ce4cf"/><text x="538" y="243" text-anchor="middle" font-size="17" fill="#071820">4</text><text x="566" y="241" fill="#eff7fa" font-size="18">Insert suggestion / Apply needed</text><text x="566" y="265" fill="#eff7fa" font-size="18">plugins</text><text x="532" y="301" fill="#c1d7e4" font-size="17">Apply a measured starting point</text><rect x="24" y="340" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="50" cy="369" r="17" fill="#6ce4cf"/><text x="50" y="375" text-anchor="middle" font-size="17" fill="#071820">5</text><text x="78" y="373" fill="#eff7fa" font-size="18">Stem Cleanup</text><text x="44" y="409" fill="#c1d7e4" font-size="17">Noise reduction and click repair</text><rect x="512" y="340" width="464" height="93" rx="10" fill="#192a39" stroke="#415d70"/><circle cx="538" cy="369" r="17" fill="#6ce4cf"/><text x="538" y="375" text-anchor="middle" font-size="17" fill="#071820">6</text><text x="566" y="373" fill="#eff7fa" font-size="18">Undo / bypass / compare</text><text x="532" y="409" fill="#c1d7e4" font-size="17">Check whether the change helps</text></g></svg>