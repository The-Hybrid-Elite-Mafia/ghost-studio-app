<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 433" role="img"><title>Playback, tempo and timeline step by step</title><rect width="1000" height="433" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="43" fill="#eff7fa" font-size="24">Playback, tempo and timeline · follow in order</text><rect x="22" y="76" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="105" r="18" fill="#6ce4cf"/><text x="52" y="111" fill="#071820" text-anchor="middle" font-size="18">1</text><text x="86" y="107" fill="#eff7fa" font-size="18">Press Play and tap the ruler to seek.</text><path d="M52 135v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="159" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="188" r="18" fill="#6ce4cf"/><text x="52" y="194" fill="#071820" text-anchor="middle" font-size="18">2</text><text x="86" y="190" fill="#eff7fa" font-size="18">Select a clip and drag it horizontally to change its start time; use Snap to beat if</text><text x="86" y="215" fill="#eff7fa" font-size="18">wanted.</text><path d="M52 243v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="267" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="296" r="18" fill="#6ce4cf"/><text x="52" y="302" fill="#071820" text-anchor="middle" font-size="18">3</text><text x="86" y="298" fill="#eff7fa" font-size="18">Set Time range Start and End to loop or export a region.</text><path d="M52 326v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="350" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="379" r="18" fill="#6ce4cf"/><text x="52" y="385" fill="#071820" text-anchor="middle" font-size="18">4</text><text x="86" y="381" fill="#eff7fa" font-size="18">Seek inside a selected audio clip and choose Split at playhead to make two pieces.</text></g></svg>