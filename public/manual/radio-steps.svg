<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 566" role="img"><title>Listen and adjust the radio EQ step by step</title><rect width="1000" height="566" rx="18" fill="#0c1420"/><g font-family="Arial,sans-serif"><text x="28" y="43" fill="#eff7fa" font-size="24">Listen and adjust the radio EQ · follow in order</text><rect x="22" y="76" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="105" r="18" fill="#6ce4cf"/><text x="52" y="111" fill="#071820" text-anchor="middle" font-size="18">1</text><text x="86" y="107" fill="#eff7fa" font-size="18">Open Radio and choose Listen. Pick All music or a genre, then tap a song.</text><path d="M52 135v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="159" width="956" height="57" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="188" r="18" fill="#6ce4cf"/><text x="52" y="194" fill="#071820" text-anchor="middle" font-size="18">2</text><text x="86" y="190" fill="#eff7fa" font-size="18">Use Play/Pause and the position slider. Previous and Next change tracks in this player.</text><path d="M52 218v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="242" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="271" r="18" fill="#6ce4cf"/><text x="52" y="277" fill="#071820" text-anchor="middle" font-size="18">3</text><text x="86" y="273" fill="#eff7fa" font-size="18">Turn Shuffle on for random order; Repeat playlist repeats the playlist rather than</text><text x="86" y="298" fill="#eff7fa" font-size="18">selecting one-track looping.</text><path d="M52 326v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="350" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="379" r="18" fill="#6ce4cf"/><text x="52" y="385" fill="#071820" text-anchor="middle" font-size="18">4</text><text x="86" y="381" fill="#eff7fa" font-size="18">Open the 10-band equalizer or tap Ghost to reveal it. Start with Reset, then change a band</text><text x="86" y="406" fill="#eff7fa" font-size="18">only if wanted.</text><path d="M52 434v19m-6-6 6 6 6-6" fill="none" stroke="#6ce4cf" stroke-width="2"/><rect x="22" y="458" width="956" height="82" rx="10" fill="#142c39" stroke="#416679"/><circle cx="52" cy="487" r="18" fill="#6ce4cf"/><text x="52" y="493" fill="#071820" text-anchor="middle" font-size="18">5</text><text x="86" y="489" fill="#eff7fa" font-size="18">Compare Bypass EQ with the adjusted version. Use Volume for listening level and preamp to</text><text x="86" y="514" fill="#eff7fa" font-size="18">cut or boost the listening level.</text></g></svg>