name: Unpack Ghost Studio v40
on:
  push:
    paths:
      - '.github/workflows/unpack-v40.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and verify all 377 source files
        shell: python
        run: |
          import hashlib, pathlib, zipfile, subprocess
          archive = pathlib.Path('Ghost-Studio-Complete-Source-v40.zip')
          if not archive.exists():
              print('Archive already unpacked.')
              raise SystemExit(0)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '7b069f1fd614f3dcd48aa38d06d756a2e31a19c98824c6eb89e1a355a9c497e8'
          root = pathlib.Path.cwd().resolve()
          paths = []
          with zipfile.ZipFile(archive) as source:
              for entry in source.infolist():
                  if entry.is_dir():
                      continue
                  parts = pathlib.PurePosixPath(entry.filename).parts
                  assert parts[0] == 'ghost-studio-app' and len(parts) > 1
                  relative = pathlib.Path(*parts[1:])
                  assert '.git' not in relative.parts and '..' not in relative.parts
                  target = (root / relative).resolve()
                  assert target.is_relative_to(root)
                  assert not target.exists(), f'Refusing to overwrite {relative}'
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read(entry))
                  assert target.read_bytes() == source.read(entry)
                  paths.append(str(relative))
          assert len(paths) == 377, len(paths)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).split(b'\x00')
          assert len([p for p in staged if p]) == 377
          print('Verified all 377 source files byte-for-byte and staged them at repository root.')
      - name: Commit source files
        run: |
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Unpack Ghost Studio v40 source into repository root'
          git push origin HEAD:main
